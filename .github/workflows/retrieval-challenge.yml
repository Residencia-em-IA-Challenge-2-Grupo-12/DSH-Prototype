name: Retrieval challenge checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test labels and scoring without model downloads
        run: python -m unittest discover -s experiments/embedding-screen/challenge -p 'test*.py'
