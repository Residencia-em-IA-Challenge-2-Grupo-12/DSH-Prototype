name: Solver experiment
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned solver
        run: python -m pip install ortools==9.14.6206
      - name: Test both scheduling approaches
        run: python -m unittest discover -s tests -p 'test_solver_comparison.py'
