name: DSH native panel checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
      - run: npm ci
      - name: Install pinned panel builder
        run: npm install --prefix "$RUNNER_TEMP/study-panel-build" esbuild@0.25.5 --no-audit --no-fund
      - name: Build synthetic panel
        run: ESBUILD_BIN="$RUNNER_TEMP/study-panel-build/node_modules/.bin/esbuild" node experiments/dsh-native-panel/build.mjs
      - name: Test panel contract and cleanup
        run: node --test --test-isolation=none experiments/dsh-native-panel/host.test.mjs experiments/dsh-native-panel/panel-view.test.mjs experiments/dsh-native-panel/process-cleanup.test.mjs
      - name: Test isolated DSH carrier
        run: node experiments/dsh-native-panel/carrier-test.mjs
