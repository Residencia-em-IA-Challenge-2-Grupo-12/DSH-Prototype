name: Synthetic worker checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Test worker validation and cleanup logic
        run: node --test --test-isolation=none experiments/synthetic-worker/worker.test.mjs
