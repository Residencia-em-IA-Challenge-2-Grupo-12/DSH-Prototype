name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
      - name: Install PDF text extraction
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install pinned dependencies
        run: npm ci
      - name: Install StudyBuddy Python pipeline runner and run pytest
        run: |
          python3 -m venv runners/studybuddy-pipeline/.venv
          runners/studybuddy-pipeline/.venv/bin/pip install -e "runners/studybuddy-pipeline[dev]"
          runners/studybuddy-pipeline/.venv/bin/pytest runners/studybuddy-pipeline/tests -v
      - name: Run offline tests
        run: npm test
      - name: Validate portable bilingual onboarding package
        run: npm run build:onboarding
