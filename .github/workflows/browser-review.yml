name: Scripted browser review

on:
  pull_request:
    paths: ['public/**', 'src/**', 'fixtures/**', 'tests/browser-review/**', 'package*.json', '.github/workflows/browser-review.yml']
  push:
    branches: [main]
    paths: ['public/**', 'src/**', 'fixtures/**', 'tests/browser-review/**', 'package*.json', '.github/workflows/browser-review.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
      - run: npm ci
      - name: Run the synthetic Chrome review
        run: |
          google-chrome --version
          node tests/browser-review/scripted.mjs "$RUNNER_TEMP/study-browser"
      - name: Retain synthetic browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-browser-review
          path: ${{ runner.temp }}/study-browser
