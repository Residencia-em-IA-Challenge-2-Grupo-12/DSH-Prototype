name: Feature or task
description: Describe a small, verifiable unit of work.
title: "[Feature] "
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Describe the desired behavior and why it matters.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable checks and relevant edge cases.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Context, dependencies, and decisions
      description: Link the parent/blockers and source decision or spec. State what is settled versus still a proposal.
  - type: textarea
    id: next
    attributes:
      label: Evidence and next action
      description: For ongoing work, link current evidence and name the next concrete action and accountable owner, or record the ownership gap.
      placeholder: Evidence link; next action; owner or ownership gap.
