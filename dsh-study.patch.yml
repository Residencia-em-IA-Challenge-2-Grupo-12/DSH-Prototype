- id: agent-default-model
  config:
    provider: codex
    model: gpt-6-luna
- insert:
    - id: mcp-synthetic-study
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: study
        transport: stdio
        command: !!js "process.cwd() + '/node_modules/.bin/node'"
        args:
          - !!js "process.cwd() + '/src/mcp.mjs'"
        cwd: !!js process.cwd()
# All model calls in this profile must use the authorized Luna route.
- id: compaction-basic
  config:
    summarizationProvider: codex
    summarizationModel: gpt-6-luna
    maxTokens: 2048
- id: session-title-llm
  disabled: true
- id: tool-web
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
