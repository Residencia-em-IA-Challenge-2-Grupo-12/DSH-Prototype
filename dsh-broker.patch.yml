# Disposable sessions must use the broker-only MCP; no simulator fallback.
- id: mcp-synthetic-study
  config:
    serverName: study
    transport: stdio
    command: !!js process.execPath
    args:
      - !!js "process.cwd() + '/src/mcp-broker.mjs'"
    cwd: !!js process.cwd()
    env:
      STUDY_BROKER_SOCKET: !!js process.env.STUDY_BROKER_SOCKET
      STUDY_COLD_START: !!js process.env.STUDY_COLD_START || '0'
      STUDY_BROWSER_COLD_START: !!js process.env.STUDY_BROWSER_COLD_START || '0'
    failOnStartupError: true
