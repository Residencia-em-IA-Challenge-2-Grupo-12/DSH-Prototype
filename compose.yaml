services:
  calendarpit:
    image: ghcr.io/iktakahiro/calendarpit:0.9.7@sha256:6baaca2eb2e587dbc52f9e63f7bc787188569578a6cba2981b1e380c91e54e96
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      CALENDARPIT_DATABASE: ":memory:"
      CALENDARPIT_CONFIG: /fixtures/ana.json
    volumes:
      - ./fixtures/calendars:/fixtures:ro

  # Experimental only: there is deliberately no route from DSH to this service yet.
  model-gateway:
    profiles: [model-gateway]
    build:
      context: .
      dockerfile: Dockerfile.model-gateway
    user: node
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    secrets: [openrouter_env, gateway_token]
    volumes:
      - model-budget:/var/lib/study-model-budget
    networks: [gateway-isolated]

secrets:
  openrouter_env:
    file: ${STUDY_OPENROUTER_ENV_FILE:-${HOME}/.config/study-atlas/openrouter.env}
  gateway_token:
    file: ${STUDY_GATEWAY_TOKEN_FILE:-./.gateway-control/gateway-token}

volumes:
  model-budget:

networks:
  gateway-isolated:
    internal: true
