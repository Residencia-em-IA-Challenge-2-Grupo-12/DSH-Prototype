<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Atlas · synthetic calendar review</title><link rel="stylesheet" href="/managed.css">
<body><main><header><div class="topline"><h1>Study Atlas</h1><label>Language / Idioma <select id="language"><option value="en">English</option><option value="pt">Português brasileiro</option></select></label></div><p id="mode" class="runtime-note"></p><p id="access-note" class="runtime-note"></p></header>
<section class="run-card" aria-label="Synthetic run"><div class="run-actions"><select id="student" aria-label="Student"><option value="bruno">Bruno</option><option value="ana">Ana</option></select><button id="start" disabled></button><button id="retire" disabled></button><button id="refresh"></button></div><p id="run"></p><p id="run-warning" role="status"></p><p id="notice" role="alert" aria-live="polite"></p></section>
<div class="layout"><article class="panel chat-panel"><h2 id="chat-title"></h2><p id="chat-progress" role="status"></p><div id="messages" aria-live="polite"></div><div id="question"></div><form id="chat"><label for="text" id="message-label">Your message</label><textarea id="text" required></textarea><button id="send" disabled></button></form></article><article class="panel calendar-panel"><section id="review"><h2 id="proposal-title"></h2><p id="approval-note" class="review-note"></p><div id="proposal"></div></section><h2 id="calendar-title"></h2><div id="calendar"></div></article></div>
</main><script type="module" src="/managed.js"></script></body></html>
